name: V5.0.7 Global 360 APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.build-results/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v5.0.7-global-360-blocks
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_ENV: production

jobs:
  verify-and-build:
    name: Verify V5.0.7 and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication and linked EAS project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami --non-interactive
          npx --yes eas-cli@latest project:info

      - name: Verify V5.0.7 version chain
        shell: bash
        run: |
          set -euo pipefail
          grep -F "APP_SEMVER='5.0.7'" src/v3/version.ts
          grep -F 'APP_BUILD=54' src/v3/version.ts
          grep -F '"version": "5.0.7"' app.json
          grep -F '"runtimeVersion": "5.0.7"' app.json
          grep -F '"versionCode": 50007' app.json
          grep -F 'versionCode 50007' android/app/build.gradle
          grep -F 'versionName "5.0.7"' android/app/build.gradle
          grep -F '<string name="app_name">ETF財務管家 V5.0.7 NATIVE</string>' android/app/src/main/res/values/strings.xml
          grep -F '<string name="expo_runtime_version">5.0.7</string>' android/app/src/main/res/values/strings.xml

      - name: Verify canonical Huanan finance core wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f src/types/etf.ts
          test -f src/utils/etfCalculators.ts
          test ! -e src/data/tradeSettings.ts
          test ! -e src/v3/engineBase.ts
          grep -F "from '../utils/etfCalculators'" src/v3/engine.ts
          grep -F 'calculatePortfolioSummary' src/v3/engine.ts
          grep -F 'portfolioSummary?: PortfolioSummary' src/widgets/ProfitWidget.tsx
          grep -F 'netLiquidationValue' src/widgets/ProfitWidget.tsx
          grep -F 'unrealizedProfit' src/widgets/ProfitWidget.tsx

      - name: Huanan breaking-core contracts
        run: |
          node scripts/BREAKING_HUANAN_CORE_TEST.cjs
          node scripts/FINAL_ZERO_LEGACY_TEST.cjs

      - name: TypeScript strict check
        run: npm run typecheck

      - name: 360 V2 transaction hard-gate
        run: npm run test:360

      - name: 360 runtime / zero-legacy hard-gate
        run: npm run audit:360-core

      - name: Source diff integrity
        run: git diff --check

      - name: Prepare runner-only Android build limits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m',
              'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m',
              1,
          )
          lines = []
          found_arch = False
          for line in text.splitlines():
              if line.startswith('reactNativeArchitectures='):
                  lines.append('reactNativeArchitectures=arm64-v8a')
                  found_arch = True
              else:
                  lines.append(line)
          if not found_arch:
              lines.append('reactNativeArchitectures=arm64-v8a')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Build V5.0.7 APK locally with EAS-managed signing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output "$PWD/artifacts/ETF-Finance-Manager-V5.0.7-Global360-ARM64.apk"

      - name: Verify signed APK and package metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT='artifacts/ETF-Finance-Manager-V5.0.7-Global360-ARM64.apk'
          test -s "$OUT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee artifacts/SIGNING_CERT.txt
          "$AAPT" dump badging "$OUT" | grep -E "^package:|^application-label:" | tee artifacts/APK_BADGING.txt
          grep -F "name='com.etfpilot.twselive'" artifacts/APK_BADGING.txt
          grep -F "versionName='5.0.7'" artifacts/APK_BADGING.txt
          grep -F "versionCode='50007'" artifacts/APK_BADGING.txt
          sha256sum "$OUT" | tee artifacts/SHA256.txt
          stat -c 'apk_size_bytes=%s' "$OUT" | tee artifacts/BUILD_INFO.txt
          {
            echo 'source_commit='$(git rev-parse HEAD)
            echo 'package=com.etfpilot.twselive'
            echo 'versionName=5.0.7'
            echo 'versionCode=50007'
            echo 'tag=v5.0.7-global-360'
            echo 'finance_core=src/utils/etfCalculators.ts'
            echo 'architecture=arm64-v8a'
          } >> artifacts/BUILD_INFO.txt

      - name: Create final release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG='v5.0.7-global-360'
          CURRENT="$(git rev-parse HEAD)"
          git fetch --tags --force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            if [ "$EXISTING" != "$CURRENT" ]; then
              git tag -fa "$TAG" HEAD -m 'ETF財務管家 V5.0.7 Global 360'
              git push --force origin "refs/tags/$TAG"
            else
              echo "Tag already exists at release commit: $CURRENT"
            fi
          else
            git tag -a "$TAG" HEAD -m 'ETF財務管家 V5.0.7 Global 360'
            git push origin "$TAG"
          fi

      - name: Upload V5.0.7 signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Finance-Manager-V5.0.7-Global360-ARM64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish build completion marker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          mkdir -p .build-results
          {
            echo "status=${{ job.status }}"
            echo "run_id=$GITHUB_RUN_ID"
            echo "source_commit=$GITHUB_SHA"
            echo "artifact_name=ETF-Finance-Manager-V5.0.7-Global360-ARM64"
            echo "versionName=5.0.7"
            echo "versionCode=50007"
          } > .build-results/latest-apk.txt
          git add .build-results/latest-apk.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: record completed V5.0.7 APK [skip ci]"
            git push origin HEAD:main
          fi
