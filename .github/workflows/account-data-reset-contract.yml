name: Account Data Reset Contract

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ACCOUNT_DATA_RESET_CONTRACT_TEST.cjs'
      - 'src/v3/accountDataReset.ts'
      - 'App.tsx'
      - 'src/v3/screensBase.tsx'
      - '.github/workflows/account-data-reset-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Accounting data reset contract
        run: node scripts/ACCOUNT_DATA_RESET_CONTRACT_TEST.cjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run typecheck
