name: Apply Broker Profiles V3.7.5

on:
  push:
    branches: [v3.7.5-broker-profiles-20260916]
    paths: ['.gogo-v375-broker-profiles-trigger']
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v3.7.5-broker-profiles-20260916
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate patcher syntax
        run: python3 -m py_compile scripts/APPLY_BROKER_PROFILES_V375.py
      - name: Apply broker profile integration
        run: python3 scripts/APPLY_BROKER_PROFILES_V375.py
      - name: Broker profile contracts
        run: |
          node scripts/BROKER_PROFILE_V375_TEST.cjs
          node scripts/HUANAN_ACCOUNTING_V375_TEST.cjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit deterministic integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/tradeSettings.ts src/data/portfolio.ts src/v3/model.ts src/v3/storage.ts src/v3/engine.ts src/v3/screens.tsx src/v3/screensBase.tsx App.tsx scripts/APPLY_BROKER_PROFILES_V375.py
          if git diff --cached --quiet; then
            echo 'No broker profile integration changes to commit.'
          else
            git commit -m 'feat(v3.7.5): integrate broker profile management and bookkeeping binding'
            git push origin HEAD:v3.7.5-broker-profiles-20260916
          fi
