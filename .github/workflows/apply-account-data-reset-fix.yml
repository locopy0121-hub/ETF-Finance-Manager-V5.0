name: Apply Account Data Reset Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_account_data_reset_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Apply deterministic source patch
        run: python3 scripts/apply_account_data_reset_fix.py
      - name: Accounting data reset contract
        run: node scripts/ACCOUNT_DATA_RESET_CONTRACT_TEST.cjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run typecheck
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/v3/screensBase.tsx
          git commit -m "fix: reset all accounting data safely"
          git push
