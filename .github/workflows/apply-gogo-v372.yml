name: Apply GOGO V3.7.2 Integrated Patch

on:
  push:
    branches: [v3.7-upgrade-20260915]
    paths:
      - '.gogo-v372-apply-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply deterministic finance and ledger patch
        run: python scripts/APPLY_GOGO_V372.py
      - name: Verify required source contracts locally
        run: |
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
          node scripts/ACCOUNTING_GOLDEN_00878.cjs
          node scripts/CASH_LEDGER_CONTRACT_TEST.cjs
      - name: Commit and push patched sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch delta; branch already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/v3/screens.tsx src/v3/storage.ts
          git commit -m "fix(v3.7.2): unify cash ledger sell fees and migration"
          git push origin HEAD:v3.7-upgrade-20260915
