name: V5.0.10 Continuous Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.0.10 source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Huanan breaking-core contracts
        run: |
          node scripts/BREAKING_HUANAN_CORE_TEST.cjs
          node scripts/FINAL_ZERO_LEGACY_TEST.cjs

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: 360 V2 transaction hard-gate
        run: npm run test:360

      - name: Global 360 zero-legacy hard-gate
        run: npm run audit:360-core

      - name: Verify V5.0.10 version chain
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"version": "5.0.10"' package.json
          grep -F '"version": "5.0.10"' app.json
          grep -F '"runtimeVersion": "5.0.10"' app.json
          grep -F "APP_SEMVER='5.0.10'" src/v3/version.ts
          grep -F 'APP_BUILD=57' src/v3/version.ts
          grep -F '"versionCode": 50010' app.json
          grep -F 'versionCode 50010' android/app/build.gradle
          grep -F '<string name="expo_runtime_version">5.0.10</string>' android/app/src/main/res/values/strings.xml
          grep -F 'versionName "5.0.10"' android/app/build.gradle
          grep -F 'ETF財務管家 V5.0.10 NATIVE' android/app/src/main/res/values/strings.xml
          grep -F 'V5.0.10 360 Gated Repair：依序完成拖曳、Resize、Nudge、Snap / ZERO OVERLAP、Block 命名、A→B→C→D→E 層級、Grid 純輔助、手勢互斥、Z 圖層、文字/文字背景/方塊背景損益色、raw numeric 判色、背景分層、真實預覽、生命週期與 Settings 單一 360 主開關修復；同步版本鏈至 5.0.10 / 50010 / build 57；5.1.x 圖表進階功能維持延後，不混入本輪。' README.md

      - name: Source diff integrity
        run: git diff --check
