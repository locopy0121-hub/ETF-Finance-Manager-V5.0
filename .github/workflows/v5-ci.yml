name: V5.0.5 Continuous Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.0.5 source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Huanan breaking-core contracts
        run: |
          node scripts/BREAKING_HUANAN_CORE_TEST.cjs
          node scripts/FINAL_ZERO_LEGACY_TEST.cjs

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: 360 V2 transaction hard-gate
        run: npm run test:360

      - name: Global 360 zero-legacy hard-gate
        run: npm run audit:360-core

      - name: Verify V5.0.5 version chain
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"version": "5.0.5"' package.json
          grep -F '"version": "5.0.5"' app.json
          grep -F '"runtimeVersion": "5.0.5"' app.json
          grep -F "APP_SEMVER='5.0.5'" src/v3/version.ts
          grep -F 'versionName "5.0.5"' android/app/build.gradle
          grep -F 'ETF財務管家 V5.0.5 NATIVE' android/app/src/main/res/values/strings.xml
          grep -F 'V5.0.5 Global 360 Frame + Block Workspace：採 A-B / B-C / C-D / D-E 分層' README.md

      - name: Source diff integrity
        run: git diff --check
