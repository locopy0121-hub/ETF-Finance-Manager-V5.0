name: V5.0.6 Continuous Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.0.6 source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Huanan breaking-core contracts
        run: |
          node scripts/BREAKING_HUANAN_CORE_TEST.cjs
          node scripts/FINAL_ZERO_LEGACY_TEST.cjs

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: 360 V2 transaction hard-gate
        run: npm run test:360

      - name: Global 360 zero-legacy hard-gate
        run: npm run audit:360-core

      - name: Verify V5.0.6 version chain
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"version": "5.0.6"' package.json
          grep -F '"version": "5.0.6"' app.json
          grep -F '"runtimeVersion": "5.0.6"' app.json
          grep -F "APP_SEMVER='5.0.6'" src/v3/version.ts
          grep -F 'versionName "5.0.6"' android/app/build.gradle
          grep -F 'ETF財務管家 V5.0.6 NATIVE' android/app/src/main/res/values/strings.xml
          grep -F 'V5.0.6 360 Editor Stability Update：Settings 下拉改為單一展開＋延遲掛載；360 總開關作為總權限、各頁設定模式作為頁面權限；修正 Modern Screen 重複 PageFrame 攔截層；背景與文字背景規則完全分離，背景／圖片支援相簿選取、縮放、位移、旋轉、透明度與顯示模式。' README.md

      - name: Source diff integrity
        run: git diff --check
