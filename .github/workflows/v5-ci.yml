name: V5.0.1 Continuous Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify V5.0.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Huanan breaking-core contracts
        run: |
          node scripts/BREAKING_HUANAN_CORE_TEST.cjs
          node scripts/FINAL_ZERO_LEGACY_TEST.cjs

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Verify V5.0.1 version chain
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"version": "5.0.1"' package.json
          grep -F '"version": "5.0.1"' app.json
          grep -F '"runtimeVersion": "5.0.1"' app.json
          grep -F "APP_SEMVER='5.0.1'" src/v3/version.ts
          grep -F 'versionName "5.0.1"' android/app/build.gradle
          grep -F 'ETF財務管家 V5.0.1 NATIVE' android/app/src/main/res/values/strings.xml
          grep -F 'V5.0 正式上線：全藍圖 B UI 重構、7x5/7x6 智慧股息月曆、獨立 5 大 Tab 導覽與全方位連網 AI 助理' README.md

      - name: Source diff integrity
        run: git diff --check
