name: Fix Broker Profile Types V3.7.5

on:
  push:
    branches: [v3.7.5-broker-profiles-20260916]
    paths: ['.fix-v375-broker-profile-types-trigger']
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v3.7.5-broker-profiles-20260916
          fetch-depth: 20
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Validate fixer syntax
        run: python3 -m py_compile scripts/FIX_BROKER_PROFILE_TYPES_V375.py
      - name: Apply targeted type repair
        run: python3 scripts/FIX_BROKER_PROFILE_TYPES_V375.py
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Broker accounting contracts
        run: |
          node scripts/BROKER_PROFILE_V375_TEST.cjs
          node scripts/HUANAN_ACCOUNTING_V375_TEST.cjs
      - name: Existing finance regressions
        run: |
          node scripts/FINANCE_ENGINE_V342_TEST.cjs
          node scripts/FORMULA_ENGINE_V342_TEST.cjs
          node scripts/V340_FIX1_REGRESSION_AUDIT.cjs
          node scripts/DIVIDEND_CUTOFF_TEST.cjs
          node scripts/ACCOUNTING_CONTRACT_TEST.cjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx src/v3/screensBase.tsx scripts/FIX_BROKER_PROFILE_TYPES_V375.py
          if git diff --cached --quiet; then
            echo 'No type repair changes to commit.'
          else
            git commit -m 'fix(v3.7.5): complete broker profile type wiring'
            git push origin HEAD:v3.7.5-broker-profiles-20260916
          fi
